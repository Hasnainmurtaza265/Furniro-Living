<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Furniro - eCommerce</title>
  <!-- Google Fonts: Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <script defer src="./app.js"></script>
</head>
<body>

  <!-- ================= NAVBAR ================= -->
  <header class="navbar">
    <div class="nav-container">
      
      <!-- Logo -->
      <a href="#" class="logo">
        <svg width="32" height="20" viewBox="0 0 50 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M15.5 0L31 32H0L15.5 0Z" fill="#B88E2F"/>
          <path d="M34.5 0L50 32H19L34.5 0Z" fill="#B88E2F"/>
        </svg>
        <span>Furniro</span>
      </a>

      <!-- Navigation Links -->
      <nav class="nav-menu" id="navMenu">
        <ul>
          <li><a href="#" class="active">Home</a></li>
          <li><a href="#">Shop</a></li>
          <li><a href="#">About</a></li>
          <li><a href="#">Contact</a></li>
        </ul>
      </nav>

      <!-- Action Icons -->
      <div class="nav-icons">
        <a href="#" title="Account"><i class="fa-regular fa-user"></i></a>
        <a href="#" title="Search"><i class="fa-solid fa-magnifying-glass"></i></a>
        <a href="#" title="Wishlist"><i class="fa-regular fa-heart"></i></a>
        <a href="#" title="Cart"><i class="fa-solid fa-cart-shopping"></i></a>
        
        <!-- Hamburger Menu Button for Mobile -->
        <button class="hamburger" id="hamburgerBtn" aria-label="Toggle Menu">
          <i class="fa-solid fa-bars"></i>
        </button>
      </div>

    </div>
  </header>

  <!-- ================= HERO SECTION ================= -->
  <section class="hero">
    <div class="hero-container">
      <div class="hero-card">
        <p class="subtitle">New Arrival</p>
        <h1 class="title">Discover Our<br>New Collection</h1>
        <p class="description">
          Lorem ipsum dolor sit amet, consectetur adipiscing elit. Ut elit tellus, luctus nec ullamcorper mattis.
        </p>
        <a href="#" class="btn-primary">BUY NOW</a>
      </div>
    </div>
  </section>

  
</body>
</html>
